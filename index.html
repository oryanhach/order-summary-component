<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Order summary card</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kumbh+Sans:wght@100..900&family=Lexend+Deca:wght@100..900&family=Outfit:wght@100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="card">
    <img class="card__image" src="images/illustration-hero.svg"
      alt="an illustration of someone listening to music and dancing">
    <div class="card__content">
      <h2></h2>
      <p></p>
      <div class="">
        <div>
          <img src="images/icon-music.svg" alt="">
        </div>
        <div>
          <p>Annual Plan</p>
          <p>$59.99/year</p>
        </div>
        <button>Change</button>
      </div>

      <button>Proceed to Payment</button>
      <button>Cancel Order</button>
    </div>

  </div>


</body>

</html>
